name: VM7 critical secret boundary proof
on:
  push:
    branches:
      - main
permissions:
  contents: read
jobs:
  secret-proof:
    runs-on: ubuntu-latest
    steps:
      - name: Secret binding proof
        shell: bash
        env:
          CANARY: ${{ secrets.CRITICAL_CANARY_SECRET }}
        run: |
          set -euo pipefail
          test -n "${CANARY:-}"
          python3 - <<'PY'
          import hashlib, os
          secret = os.environ["CANARY"]
          sha = os.environ["GITHUB_SHA"]
          print("SECRET_PRESENT=yes")
          print("SECRET_BINDING_SHA256=" + hashlib.sha256((secret + ":" + sha).encode()).hexdigest())
          PY
